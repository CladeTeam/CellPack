[package]
name = "cellpack"
description = "Per-cell scans-coded records for single-cell matrices, with an OPT-planned cell loader"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/cellpack"
readme = "../../README.md"
license-file = "../../LICENSE"

[lib]
crate-type = ["rlib"]

[[example]]
name = "codec"
path = "examples/bench/codec.rs"

[[example]]
name = "encode"
path = "examples/bench/encode.rs"

[features]
default = []
# Serde for the cost model's data types (JSON in the field names).
serde = ["dep:serde"]

[dependencies]
thiserror.workspace = true
libc.workspace = true
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
io-uring = "0.7"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
