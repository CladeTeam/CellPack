name: Release candidate and publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to BOTH PyPI and crates.io (tag ref and environment approval required)'
        type: boolean
        default: false
      draft_release:
        description: 'Create or update a draft GitHub Release (tag ref required)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  RUST_TOOLCHAIN: '1.96.1'
  MATURIN_VERSION: '1.15.0'
  CARGO_BUILD_JOBS: '2'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
jobs:
  version:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      python_version: ${{ steps.check.outputs.python_version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: check
        env:
          REQUIRE_TAG: ${{ github.event_name == 'push' || inputs.publish || inputs.draft_release }}
        run: |
          if [ "$REQUIRE_TAG" = true ]; then
            python scripts/release_check.py --require-tag
          else
            python scripts/release_check.py
          fi
  validation:
    needs: version
    uses: ./.github/workflows/ci.yml
  wheels:
    timeout-minutes: 45
    needs: version
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, arch: x86_64}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, arch: aarch64}
        python:
          - {version: '3.10', abi: '310'}
          - {version: '3.11', abi: '311'}
          - {version: '3.12', abi: '312'}
          - {version: '3.13', abi: '313'}
          - {version: '3.14', abi: '314'}
          - {version: '3.15', abi: '315'}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python.version }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.16'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          args: >-
            --release --locked --out dist/python
            --interpreter /opt/python/cp${{ matrix.python.abi }}-cp${{ matrix.python.abi }}/bin/python
      - run: |
          uv venv .wheel-venv --python python
          uv pip install --python .wheel-venv/bin/python dist/python/*.whl
          uv run --no-project --python .wheel-venv/bin/python python scripts/smoke_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-${{ matrix.platform.arch }}-${{ matrix.python.abi }}
          path: dist/python/*.whl
          if-no-files-found: error
          retention-days: 14
  sdist:
    timeout-minutes: 45
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.16'
      - run: |
          uv tool run --from "maturin==$MATURIN_VERSION" maturin sdist --out dist/python
          uv venv .sdist-venv --python python
          uv pip install --python .sdist-venv/bin/python dist/python/*.tar.gz
          uv run --no-project --python .sdist-venv/bin/python python scripts/smoke_package.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-sdist
          path: dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 14
  crate:
    timeout-minutes: 45
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo package --locked -p cellpack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-crate
          path: target/package/cellpack-*.crate
          if-no-files-found: error
          retention-days: 14
  bundle:
    timeout-minutes: 10
    needs: [version, validation, wheels, sdist, crate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.16'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          merge-multiple: true
          path: candidate/python
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-crate
          path: candidate/rust
      - run: python scripts/verify_artifacts.py candidate --complete --write-checksums
      - run: uv tool run --from twine twine check --strict candidate/python/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: candidate/
          if-no-files-found: error
          retention-days: 14
  publish:
    timeout-minutes: 45
    if: github.repository == 'CladeTeam/CellPack' && github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [version, bundle]
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://github.com/CladeTeam/CellPack/releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: candidate
      - name: Verify tag, artifacts and both credentials before any upload
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          python scripts/release_check.py --require-tag
          (cd candidate && sha256sum --check SHA256SUMS)
          python -c 'import os; missing=[x for x in ("PYPI_API_TOKEN","CARGO_REGISTRY_TOKEN") if not os.environ.get(x)]; assert not missing, "Missing release environment secrets: " + ", ".join(missing)'
      - name: Publish Rust core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p cellpack --registry crates-io
      - name: Publish Python distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: candidate/python
          attestations: false
  draft:
    timeout-minutes: 10
    if: github.repository == 'CladeTeam/CellPack' && (github.event_name == 'push' || inputs.draft_release)
    needs: [version, bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: candidate
      - name: Create or update a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          python scripts/release_check.py --require-tag
          if gh release view "$TAG" --json isDraft > release-state.json 2>/dev/null; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace a published GitHub Release"'
          elif [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --verify-tag --draft --prerelease --title "$TAG" --generate-notes
          else
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" candidate/python/* candidate/rust/* candidate/SHA256SUMS --clobber
