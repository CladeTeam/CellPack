[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "pycellpack"
version = "0.1.0"
description = "CellPack matrix storage, native loading, and AnnData H5AD integration"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.16"
dependencies = [
    "numpy>=2.0",
    "typing-extensions>=4.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://cladeteam.github.io/CellPack/"
Documentation = "https://cladeteam.github.io/CellPack/python/"
Repository = "https://github.com/CladeTeam/CellPack"
Issues = "https://github.com/CladeTeam/CellPack/issues"

[project.optional-dependencies]
scipy = ["scipy>=1.13"]
# The AnnData subclass overrides AnnData internals, so the version is pinned;
# anndata 0.13 requires Python 3.12.
anndata = ["anndata==0.13.4; python_version >= '3.12'", "h5py>=3.8", "scipy>=1.13"]
dev = [
    "maturin>=1.8,<2",
    "pytest>=8.0",
    "pyright>=1.1.410",
    "ruff>=0.12",
    "scipy>=1.13",
    "pandas>=2",
    "anndata==0.13.4; python_version >= '3.12'",
    "h5py>=3.8",
]

[tool.maturin]
manifest-path = "crates/pycellpack/Cargo.toml"
features = ["extension-module"]
python-source = "src"
module-name = "pycellpack._cellpack"
exclude = [
    "**/_native*.so", "**/_native*.pyd",
    "**/node_modules/**", "**/_build/**", "**/_generated/**", "**/__pycache__/**",
    "**/.venv/**", "**/target/**", "**/.env",
]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "src/tests/**/*.py", format = "sdist" },
    { path = "docs/**/*.md", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
