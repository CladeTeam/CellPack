[project]
name = "cellpack-docs"
version = "0.1.0"
description = "Build tools for the CellPack Rust documentation"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiohttp>=3.13,<4",
    "markdownify>=1.2,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"

[dependency-groups]
dev = [
    "playwright>=1.58,<2",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
