version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "1.96"
    nodejs: "24"
  commands:
    - python -m pip install uv==0.11.16
    - uv sync --locked --project docs/cellpack
    - npm ci --prefix docs/cellpack --no-audit --no-fund
    - uv run --locked --project docs/cellpack python docs/cellpack/build.py --check-examples --output "$READTHEDOCS_OUTPUT/html"
