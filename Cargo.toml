[workspace]
members = ["crates/cellpack", "crates/pycellpack"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
publish = false
repository = "https://github.com/CladeTeam/CellPack"
homepage = "https://cladeteam.github.io/CellPack/"

[workspace.dependencies]
thiserror = "2"
libc = "0.2"
rustix = { version = "1", features = ["fs", "io_uring", "mm"] }
pyo3 = "0.29"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# Release code with full debug info for perf.
[profile.profiling]
inherits = "release"
debug = true
